[project]
name = "clarion"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.1",
    "requests==2.31.0",
    "flask>=3.0.0",
    "feedparser>=6.0.11",
    "aiohttp>=3.10",
]

[project.scripts]
clarion = "clarion.local.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/clarion",
]

[dependency-groups]
dev = [
    "mediacloud>=5.0.0",
]
