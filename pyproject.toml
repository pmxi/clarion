[project]
name = "clarion"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2",
    "python-dotenv>=1.0.1",
    "requests==2.31.0",
    "flask>=3.0.0",
    "feedparser>=6.0.11",
    "aiohttp>=3.10",
]

[project.optional-dependencies]
# Only needed by `clarion digest build`; collector and web run without it.
digest = [
    "numpy>=2.0",
    "sentence-transformers>=5.0",
    "torch>=2.4",
]

[project.scripts]
clarion = "clarion.cli:main"
clarion-web = "clarion_web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/clarion",
    "src/clarion_web",
]

[dependency-groups]
dev = [
    "mediacloud>=5.0.0",
    "pytest>=8.0",
]
