{% extends "base.html" %}
{% block title %}Add stream — Clarion{% endblock %}
{% block content %}
<section>
  <h2>Add a stream</h2>
  <p>Pick what kind of stream you want to monitor:</p>
  <ul class="stream-picker">
    <li>
      <a class="button" href="{{ url_for('streams.new_rss') }}">RSS / Atom feed</a>
      <span class="hint">Any RSS or Atom feed — news sites, blogs, Google Alerts, YouTube channels, arXiv, etc.</span>
    </li>
  </ul>
  <p><a href="{{ url_for('streams.index') }}">Cancel</a></p>
</section>
{% endblock %}
